const state={playing:false,drag:false,ready:false,index:0,split:50,poster:null};
function playbackUI(){stage.classList.toggle('is-playing',state.playing);$('play').innerHTML=(state.playing?"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 5h4v14H7zm6 0h4v14h-4z\" fill=\"currentColor\"/></svg>":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/></svg>")+'<span>'+(state.playing?'暫停':'播放')+'</span>';$('play').setAttribute('aria-label',state.playing?'暫停比較影片':'播放比較影片');}
function soundUI(){const on=!after.muted;$('sound').innerHTML=on?"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 9v6h4l5 4V5L7 9z\" fill=\"currentColor\"/><path d=\"M16 8q4 4 0 8m3-11q7 7 0 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 9v6h4l5 4V5L8 9z\" fill=\"currentColor\"/><path d=\"m17 9 5 6m0-6-5 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>";$('sound').setAttribute('aria-pressed',String(on));$('sound').setAttribute('aria-label',on?'關閉成片聲音':'開啟成片聲音');$('sound').title=on?'關閉成片聲音':'開啟成片聲音';}

function say(s){$('status').textContent=s;}
function draw(){
 const W=canvas.width,H=canvas.height,x=Math.round(W*state.split/100);
 if(after.readyState>=2&&after.videoWidth>0){
  const half=after.videoWidth/2,sh=after.videoHeight;
  if(x>0)ctx.drawImage(after,0,0,half*x/W,sh,0,0,x,H);
  if(x<W)ctx.drawImage(after,half+half*x/W,0,half*(W-x)/W,sh,x,0,W-x,H);
 }else if(state.poster&&state.poster.complete){ctx.drawImage(state.poster,0,0,W,H);}
}
function clock(){const d=Number.isFinite(after.duration)?after.duration:45;$('clock').textContent=after.currentTime.toFixed(2)+' / '+d.toFixed(2)+' 秒';if(!$('seek').matches(':active'))$('seek').value=after.currentTime;}
function tick(){draw();if(state.playing)clock();requestAnimationFrame(tick);}requestAnimationFrame(tick);
function split(v){state.split=Math.max(0,Math.min(100,Number(v)));stage.style.setProperty('--split',state.split+'%');$('split').value=state.split;$('handle').setAttribute('aria-valuenow',String(Math.round(state.split)));draw();}
function pause(){after.pause();state.playing=false;playbackUI();}
async function play(){
 if(!state.ready)return;
 if(state.playing){pause();return;}
 if(after.ended||after.currentTime>=after.duration-.06)after.currentTime=0;
 try{await after.play();state.playing=true;playbackUI();say('左右拖曳中間圓鈕比較。');}catch(e){pause();say('請再按一次播放。');}
}
function chooseFilm(index){
 pause();state.index=index;state.ready=false;$('play').disabled=true;$('seek').disabled=true;
 const f=FILMS[index];$('filmTitle').textContent=f.name;
 $('film1').setAttribute('aria-pressed',String(index===0));$('film2').setAttribute('aria-pressed',String(index===1));
 after.muted=true;after.defaultMuted=true;soundUI();
 state.poster=new Image();state.poster.onload=draw;state.poster.src=f.afterPoster;
 const url=new URL(f.source,location.href);url.searchParams.set('v','approved11');after.src=url.href;after.load();
 $('direct').href=url.href;$('direct').textContent='檢查影片檔 ↗';
 split(50);say('正在載入同步比較影片…');
}
after.addEventListener('loadedmetadata',()=>{state.ready=true;$('play').disabled=false;$('seek').disabled=false;$('seek').max=after.duration;clock();});
after.addEventListener('loadeddata',()=>{state.ready=true;$('play').disabled=false;$('seek').disabled=false;draw();say('按畫面上的播放鍵開始比較，預設靜音。');});
after.addEventListener('canplay',()=>{state.ready=true;$('play').disabled=false;$('seek').disabled=false;draw();});
after.addEventListener('playing',()=>{state.playing=true;playbackUI();});
after.addEventListener('ended',()=>{pause();clock();draw();});
after.addEventListener('seeked',()=>{draw();clock();});
after.addEventListener('waiting',()=>say('正在緩衝，左右畫面會一起等待。'));
after.addEventListener('error',()=>{pause();state.ready=false;$('play').disabled=true;say('影片載入失敗，請確認 comparison1_sync.mp4 與 comparison2_sync.mp4 已上傳到同一層。');});
$('play').onclick=play;
$('sound').onclick=()=>{after.muted=!after.muted;after.volume=1;soundUI();};
$('reset').onclick=()=>split(50);$('split').oninput=e=>split(e.target.value);
$('seek').oninput=e=>{if(state.ready){after.currentTime=Number(e.target.value);clock();}};
function fromPointer(e){const r=stage.getBoundingClientRect();split((e.clientX-r.left)/r.width*100);}
$('handle').onpointerdown=e=>{state.drag=true;e.currentTarget.setPointerCapture(e.pointerId);fromPointer(e);};
$('handle').onpointermove=e=>{if(state.drag)fromPointer(e);};
for(const n of ['pointerup','pointercancel','lostpointercapture'])$('handle').addEventListener(n,()=>state.drag=false);
$('handle').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();split(e.key==='Home'?0:e.key==='End'?100:state.split+(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?10:2));}};
$('retry').onclick=()=>chooseFilm(state.index);$('film1').onclick=()=>chooseFilm(0);$('film2').onclick=()=>chooseFilm(1);
window.addEventListener('pagehide',pause);chooseFilm(0);
</script></body></html>
