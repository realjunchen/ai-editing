<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Edit Studio｜前後比較</title>
<style>
:root{--navy:#0b1f3a;--paper:#f5f2ea;--gold:#c9a24b;--split:50%}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--paper);font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:28px 20px}header{border-top:3px solid var(--gold);padding:20px 0}small{color:#c4cbd4}h1{font-size:30px;margin:6px 0}p{margin:8px 0}.layout{display:grid;grid-template-columns:minmax(250px,420px) 1fr;gap:28px}.stage{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;background:#030a15;border-radius:14px;touch-action:pan-y;isolation:isolate}.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.stage #before{z-index:2;clip-path:inset(0 calc(100% - var(--split)) 0 0)}.badge{position:absolute;top:15px;z-index:3;padding:4px 10px;background:#0b1f3acb;border:1px solid #f5f2ea66;border-radius:20px;font-size:12px;pointer-events:none}.raw{left:10px}.done{right:10px}.divider{position:absolute;left:var(--split);top:0;bottom:0;width:3px;transform:translateX(-50%);background:var(--paper);z-index:4;pointer-events:none}.handle{position:absolute;left:var(--split);top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:2px solid var(--paper);background:var(--navy);color:var(--paper);font-size:23px;z-index:5;cursor:ew-resize;touch-action:none}.handle:focus-visible{outline:4px solid var(--gold);outline-offset:4px}.panel{align-self:center}button,.pick{background:var(--paper);color:var(--navy);border:0;border-radius:8px;font:inherit;padding:10px 16px;cursor:pointer;display:inline-block}button:disabled{opacity:.4;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pick{background:#203958;color:var(--paper);font-size:14px}.pick input{display:block;max-width:240px;font-size:12px;margin-top:6px}input[type=range]{width:100%;accent-color:var(--gold)}label{display:block;margin-top:18px;font-size:14px}#status{min-height:54px;color:#e6d29e;font-size:14px}.note{font-size:13px;color:#bfc8d3}#clock{font-variant-numeric:tabular-nums}details{margin-top:18px}summary{cursor:pointer} @media(max-width:680px){main{padding:16px}.layout{grid-template-columns:1fr}.stage{max-width:380px;margin:auto}.panel{max-width:430px;margin:auto;width:100%}h1{font-size:24px}}
.film-tabs button[aria-pressed="true"]{background:var(--gold)}.film-tabs button[aria-pressed="false"]{background:#203958;color:var(--paper)}.stage{width:min(100%,43.875vh);max-height:none;aspect-ratio:9/16;margin-inline:auto}.note{line-height:1.6}header,details,.pick{display:none!important}main{padding:8px!important}.layout{display:block!important}.stage{max-width:300px!important;margin:auto}.panel{max-width:340px;margin:auto}#filmTitle{font-size:15px!important;margin:6px 0!important}.film-tabs{margin:4px 0!important}.film-tabs button{font-size:12px;padding:8px}.panel .note{font-size:11px}#status{min-height:0;font-size:12px}label{margin-top:5px}.row{margin:6px 0}#subtitle{display:none} </style></head><body><main><header><small>LIFE EDIT STUDIO / REVIEW</small><h1>看見剪輯前後的差別</h1><p id="subtitle">拖動中間的圓鈕，同一時間比較兩邊畫面。</p></header>
<div class="row film-tabs"><button id="film1" aria-pressed="true">01｜AI 剪輯</button><button id="film2" aria-pressed="false">02｜內容系統</button></div><h2 id="filmTitle" style="font-size:20px;margin:10px 0 18px"></h2><div class="layout"><div class="stage" id="stage"><video id="after" playsinline preload="auto" muted></video><video id="before" playsinline preload="auto" muted></video><span class="badge raw">乾淨初剪</span><span class="badge done">動畫＋調色</span><div class="divider"></div><button id="handle" class="handle" role="slider" aria-label="原片與編輯後的分界" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span aria-hidden="true" style="display:block;position:absolute;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;background:#0b1f3ae6;padding:3px 10px;border-radius:12px">原始 ◀｜▶ 動畫＋調色</span>↔</button></div>
<div class="panel"><p id="status" role="status" aria-live="polite">選擇兩支相同時間軸的影片，或使用頁面內的示範。</p><div class="row"><button id="play" disabled>播放比較</button><button id="sound">開啟成片聲音</button><button id="reset">分界置中</button></div><label for="split">分界位置</label><input id="split" aria-label="分界位置" type="range" min="0" max="100" value="50"><label for="seek">影片時間 <span id="clock">0.00 / 0.00 秒</span></label><input id="seek" aria-label="影片時間" type="range" min="0" max="1" step="0.01" value="0" disabled>
<details><summary>換成自己的影片</summary><p class="note">目前兩組已使用同一份剪輯時間軸。若自行換片，兩支影片需要相同剪點與速度。</p><label class="pick">原片比較版本<input id="pickBefore" type="file" accept="video/*"></label><label class="pick">編輯後影片<input id="pickAfter" type="file" accept="video/*"></label></details><p class="note">只播放成片聲音，避免兩份聲音重疊。拖線只改可見範圍，不會重新剪片或渲染。此頁在本機讀取影片，不上傳素材。</p><p class="note">比較預覽為 360p；發布用成片為 720p。</p></div></div></main>
<script>
const $=id=>document.getElementById(id), before=$('before'),after=$('after'),stage=$('stage');
const SETTINGS=/*CONFIG_START*/{"before": "", "after": "", "note": ""}/*CONFIG_END*/;
const state={ready:new Set(),urls:{},playing:false,drag:false};
function say(s){$('status').textContent=s;}
function pause(){before.pause();after.pause();state.playing=false;$('play').textContent='播放比較';}
function split(value){let p=Math.max(0,Math.min(100,Number(value)));stage.style.setProperty('--split',p+'%');$('split').value=p;$('handle').setAttribute('aria-valuenow',String(Math.round(p)));}
function ready(){return state.ready.size===2&&Number.isFinite(before.duration)&&Number.isFinite(after.duration)&&Math.abs(before.duration-after.duration)<=.15;}
function loaded(v){state.ready.add(v.id);pause();$('play').disabled=!ready();$('seek').disabled=!ready();if(state.ready.size===2){if(!ready()){say('兩支影片長度不同，請先依相同剪點準備比較版本。');return;}$('seek').max=Math.min(before.duration,after.duration);before.currentTime=after.currentTime=0;say(SETTINGS.note||'影片已載入，請播放並拖動分界。');clock();}}
function clock(){let d=ready()?Math.min(before.duration,after.duration):0;$('clock').textContent=after.currentTime.toFixed(2)+' / '+d.toFixed(2)+' 秒';if(!$('seek').matches(':active'))$('seek').value=after.currentTime;}
async function play(){if(!ready())return;if(state.playing){pause();return;}if(after.currentTime>=Math.min(before.duration,after.duration)-.06)before.currentTime=after.currentTime=0;before.currentTime=after.currentTime;state.playing=true;try{await Promise.all([before.play(),after.play()]);if(!state.playing){before.pause();after.pause();return;}$('play').textContent='暫停';say('拖動圓鈕比較；鍵盤左右鍵也能移動分界。');}catch(e){pause();say('瀏覽器未能播放，請確認影片格式，再按一次播放。');}}
function sync(){if(state.playing){if(Math.abs(before.currentTime-after.currentTime)>.08&&!before.seeking)before.currentTime=after.currentTime;clock();}requestAnimationFrame(sync);}requestAnimationFrame(sync);
for(const v of [before,after]){v.addEventListener('loadedmetadata',()=>loaded(v));v.addEventListener('ended',()=>{pause();clock();});v.addEventListener('error',()=>{pause();state.ready.delete(v.id);$('play').disabled=true;$('seek').disabled=true;say('影片載入失敗。請重新選擇H.264 MP4，或確認比較頁旁的影片檔案。');});v.addEventListener('waiting',()=>{if(state.playing){pause();say('影片正在緩衝，已暫停兩邊；稍候再按播放。');}});}
$('play').onclick=play;$('sound').onclick=()=>{after.muted=!after.muted;$('sound').textContent=after.muted?'開啟成片聲音':'關閉聲音';};$('reset').onclick=()=>split(50);$('split').oninput=e=>split(e.target.value);
$('seek').oninput=e=>{pause();if(ready()){let t=Math.min(Number(e.target.value),before.duration,after.duration);before.currentTime=after.currentTime=t;clock();}};
function fromPointer(e){let r=stage.getBoundingClientRect();split((e.clientX-r.left)/r.width*100);}
$('handle').onpointerdown=e=>{state.drag=true;e.currentTarget.setPointerCapture(e.pointerId);fromPointer(e);};$('handle').onpointermove=e=>{if(state.drag)fromPointer(e);};for(const name of ['pointerup','pointercancel','lostpointercapture'])$('handle').addEventListener(name,()=>state.drag=false);
$('handle').onkeydown=e=>{let v=Number($('split').value);if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();split(e.key==='Home'?0:e.key==='End'?100:v+(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?10:2));}};
function select(which,file){if(!file)return;pause();state.ready.delete(which);$('play').disabled=true;$('seek').disabled=true;if(state.urls[which])URL.revokeObjectURL(state.urls[which]);state.urls[which]=URL.createObjectURL(file);$(which).src=state.urls[which];$(which).load();say('正在載入影片…');}
$('pickBefore').onchange=e=>select('before',e.target.files[0]);$('pickAfter').onchange=e=>select('after',e.target.files[0]);
window.addEventListener('pagehide',()=>{for(const u of Object.values(state.urls))URL.revokeObjectURL(u);});
if(SETTINGS.note)$('subtitle').textContent=SETTINGS.note;

const FILMS=[{"name": "AI 幫你剪影片", "note": "左：相同剪點與 1.15 倍速的乾淨初剪；右：字幕、動畫、背景與調色後的成片。只播放右邊的聲音。", "before": "before1.mp4", "beforePoster": "", "after": "after1.mp4", "afterPoster": ""}, {"name": "一次拍攝，延伸多種內容", "note": "左：相同剪點與 1.15 倍速的乾淨初剪；右：字幕、動畫、背景與調色後的成片。只播放右邊的聲音。", "before": "before2.mp4", "beforePoster": "", "after": "after2.mp4", "afterPoster": ""}];
function chooseFilm(index){
 pause();state.ready.clear();$('play').disabled=true;$('seek').disabled=true;
 const f=FILMS[index];SETTINGS.note=f.note;$('subtitle').textContent=f.note;$('filmTitle').textContent=f.name;
 $('film1').setAttribute('aria-pressed',String(index===0));$('film2').setAttribute('aria-pressed',String(index===1));
 for(const id of ['before','after']){$(id).poster=f[id+'Poster'];$(id).src=f[id];$(id).load();}
 $('seek').value=0;$('clock').textContent='0.00 / 45.00 秒';split(50);say('正在載入比較影片…');
}
$('film1').onclick=()=>chooseFilm(0);$('film2').onclick=()=>chooseFilm(1);
chooseFilm(0);

</script></body></html>
